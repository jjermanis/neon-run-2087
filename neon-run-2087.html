<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON RUN 2087</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 320, H = 200, HZ = 80, ROWS = H - HZ - 1;

// C64 palette (Pepto). Letters are used by the sprite maps below.
const COL = {K:'#000000',W:'#ffffff',R:'#68372b',C:'#70a4b2',P:'#6f3d86',G:'#588d43',
  B:'#352879',Y:'#b8c76f',O:'#6f4f25',r:'#9a6759',D:'#444444',M:'#6c6c6c',L:'#9ad284',
  l:'#6c5eb5',S:'#959595',N:'#433900'};

// Tunables
const MAX = 200;        // top speed
const KD = 0.05;        // world-distance units per (speed unit * second)
const PD = 40 / 110;    // player's distance from camera (row 110)
// Level settings. Each level is one entry in LEVELS; levelIndex says which one is active.
const LEVELS = [
  { time: 60, distance: 1000,           // seconds allowed, distance to cover
    spawnMin: 0.5, spawnMax: 1.6,       // wait between car spawn attempts (seconds)
    bendMin: 30, bendMax: 60,           // bend length range (distance units)
    straightMin: 25, straightMax: 55,   // straight length range (distance units)
    carSpeedMin: 45, carSpeedMax: 125 },  // other cars' speed range
  { time: 60, distance: 1000,
    spawnMin: 0.5, spawnMax: 1.6,
    bendMin: 30, bendMax: 60,
    straightMin: 25, straightMax: 55,
    carSpeedMin: 45, carSpeedMax: 125 }
];
let levelIndex = 0;                 // which level is being played (0 = first)
let level = LEVELS[levelIndex];     // settings of the current level
const SHOW_POS = true;              // show distance traveled (pos) on the end-of-level screen
const ROAD_HW = 120;    // half road width in px at the bottom row (was 110)
const CAR_W = 0.4;      // car width in half-road units; lane is 0.667, so 0.4 / 0.667 = 0.6
const PLAYER_W = CAR_W * ROAD_HW * 110 / 120;  // player car width in px (row 110) = 44
const START_ROW = 4;    // first visible road row below the horizon; cars first appear here
const START_D = 40 / START_ROW;    // distance at that row (10 for row 4)

// Integer scaling to fill the window
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// 4x5 bitmap font
const G = {
  A:'0110/1001/1111/1001/1001',C:'0111/1000/1000/1000/0111',D:'1110/1001/1001/1001/1110',
  E:'1111/1000/1110/1000/1111',H:'1001/1001/1111/1001/1001',I:'1110/0100/0100/0100/1110',
  M:'1001/1111/1111/1001/1001',N:'1001/1101/1011/1001/1001',O:'0110/1001/1001/1001/0110',
  P:'1110/1001/1110/1000/1000',R:'1110/1001/1110/1010/1001',S:'0111/1000/0110/0001/1110',
  T:'1111/0100/0100/0100/0100',U:'1001/1001/1001/1001/0110',
  0:'0110/1001/1001/1001/0110',1:'0010/0110/0010/0010/0111',2:'0110/1001/0010/0100/1111',
  3:'1110/0001/0110/0001/1110',4:'1001/1001/1111/0001/0001',5:'1111/1000/1110/0001/1110',
  6:'0110/1000/1110/1001/0110',7:'1111/0001/0010/0100/0100',8:'0110/1001/0110/1001/0110',
  9:'0110/1001/0111/0001/0110'
};
function text(s, x, y, c, k) {
  ctx.fillStyle = COL[c];
  for (const ch of s) {
    const g = G[ch];
    if (g) { const rows = g.split('/');
      for (let j = 0; j < 5; j++) for (let i = 0; i < 4; i++)
        if (rows[j][i] === '1') ctx.fillRect(x + i * k, y + j * k, k, k); }
    x += 5 * k;
  }
}
const tw = (s, k) => s.length * 5 * k - k;
const ctext = (s, y, c, k) => text(s, Math.round((W - tw(s, k)) / 2), y, c, k);

// Sprites: left half only (14 cols), mirrored to 28 cols.
const CAR = [
  '...KDDDDDDDDDD',
  '......KKCCCCCC',
  '.....KCBBBBBBB',
  '....KCCCCCCCCC',
  '..KKCCCCCCCCCC',
  '.KCrWrRCCCCCCC',
  '.KCrrrRCCCCCCC',
  'KKKKCCCCCCCCWW',
  'KDDKDDDDDDDDDD',
  'KDDK..........'
];
const TRUCK = [
  '..KKKKKKKKKKKK',
  '.KMMMMMMMMMMMD',
  '.KMMMMMMMMMMMD',
  '.KMMMMMMMMMMMD',
  '.KMMMMMMMMMMMD',
  '.KrRMMMMMMMMMD',
  '.KrrMMMMMMMMMD',
  'KKDDDDDDDDDDDD',
  'KDDK..........'
];
function sprite(map, cx, by, w, hmul, pal) {
  if (w < 4) {
    ctx.fillStyle = COL.r;
    ctx.fillRect(Math.round(cx - w / 2), Math.round(by - 1), Math.max(1, Math.round(w)), 1);
    return;
  }
  const pw = w / 28, ph = pw * hmul, n = map.length;
  for (let j = 0; j < n; j++) {
    const y0 = Math.round(by - (n - j) * ph), y1 = Math.round(by - (n - j - 1) * ph);
    if (y1 <= y0) continue;
    for (let i = 0; i < 28; i++) {
      let ch = map[j][i < 14 ? i : 27 - i];
      if (ch === '.') continue;
      const x0 = Math.round(cx - w / 2 + i * pw), x1 = Math.round(cx - w / 2 + (i + 1) * pw);
      if (x1 <= x0) continue;
      ctx.fillStyle = COL[pal[ch] || ch];
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }
  }
}

// Static city skyline, drawn once (wraps horizontally)
const SKH = 48, sk = document.createElement('canvas');
sk.width = W; sk.height = SKH;
(() => {
  const c = sk.getContext('2d'); let seed = 2087;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  let x = 0;
  while (x < W) {
    const w = 6 + Math.floor(rnd() * 11), h = 10 + Math.floor(rnd() * 36), y = SKH - h;
    c.fillStyle = rnd() < 0.5 ? COL.D : COL.B; c.fillRect(x, y, w, h);
    c.fillStyle = COL.M; c.fillRect(x, y, w, 1);
    for (let wy = y + 3; wy < SKH - 1; wy += 3)
      for (let wx = x + 2; wx < x + w - 1; wx += 3)
        if (rnd() < 0.4) { c.fillStyle = COL.Y; c.fillRect(wx, wy, 1, 1); }
    if (rnd() < 0.25) { c.fillStyle = COL.M; c.fillRect(x + (w >> 1), Math.max(0, y - 5), 1, 5); }
    x += w + (rnd() < 0.3 ? 1 : 0);
  }
})();

// Game state
let state = 'title', speed = 0, px = 0, pos = 0, curve = 0, 
    skyOff = 0, time = level.time, cars = [], spawnT = 1, crashT = 0, invuln = 0;
const keys = {};
let endPos = 0;                     // pos at the moment the time ran out
const CAR_COLS = ['P', 'Y', 'l', 'W', 'G', 'O'], TRUCK_COLS = ['M', 'S', 'l'];

// Track: road bends are defined by distance traveled (pos), not by time.
const EASE = 8;                                   // distance over which one bend blends into the next
let seg = { start: 0, len: 30, bend: 0, prev: 0 };  // current track segment
function newSeg(start, prevBend) {
  if (prevBend === 0)                             // after a straight: make a bend
    return { start, len: level.bendMin + Math.random() * (level.bendMax - level.bendMin), prev: prevBend,
             bend: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.5) };
  return { start, len: level.straightMin + Math.random() * (level.straightMax - level.straightMin), prev: prevBend, bend: 0 };  // after a bend: straightt
}

function start() {
  state = 'play'; speed = 0; px = 0; pos = 0; curve = 0; seg = { start: 0, len: 30, bend: 0, prev: 0 };
  level = LEVELS[levelIndex]; time = level.time; cars = []; spawnT = 1; crashT = 0; invuln = 0;
}

function update(dt) {
  if (state === 'title') return;
  const play = state === 'play', active = play && crashT <= 0;

  if (play) { time -= dt; if (time <= 0) { time = 0; endPos = pos; state = 'over'; } }

  if (active) {
    if (keys.ArrowUp) speed += 55 * dt; else speed -= 12 * dt;
    if (keys.ArrowDown) speed -= 150 * dt;
    const steer = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    px += steer * 1.7 * (speed / MAX * 0.8 + (speed > 5 ? 0.2 : 0)) * dt;
  } else if (state === 'over') speed -= 60 * dt;
  else speed = 0;
  if (Math.abs(px) > 1.12 && speed > 80) speed -= 140 * dt;   // off-road drag
  speed = Math.max(0, Math.min(MAX, speed));

  px -= curve * (speed / MAX) * (speed / MAX) * 0.9 * dt;                      // curve pushes player outward
  px = Math.max(-1.7, Math.min(1.7, px));
  pos += speed * KD * dt;

  while (pos >= seg.start + seg.len) seg = newSeg(seg.start + seg.len, seg.bend);
  const t = Math.min(1, (pos - seg.start) / EASE);
  curve = seg.prev + (seg.bend - seg.prev) * (t * t * (3 - 2 * t));   // smoothstep blend
  skyOff -= curve * (speed / MAX) * 45 * dt;
  skyOff = ((skyOff % W) + W) % W;

  // Traffic: spawns only at the horizon, and only if the player can catch it.
  if (play) {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = level.spawnMin + Math.random() * (level.spawnMax - level.spawnMin);
      const lane = Math.floor(Math.random() * 3), sp = level.carSpeedMin + Math.random() * (level.carSpeedMax - level.carSpeedMin);
      if (sp < speed - 5 && cars.length < 12 && !cars.some(c => c.lane === lane && c.d > START_D * 0.7)) {
        const truck = Math.random() < 0.2;
        const cols = truck ? TRUCK_COLS : CAR_COLS;
        cars.push({ lane, d: START_D, od: START_D, sp, truck, col: cols[Math.floor(Math.random() * cols.length)] });
      }
    }
  }
  for (const c of cars) { c.od = c.d; c.d += (c.sp - speed) * KD * dt; }
  for (const a of cars) for (const b of cars)
    if (a !== b && a.lane === b.lane && b.d > a.d && b.d - a.d < 1.5 && a.sp > b.sp) a.sp = b.sp;
  cars = cars.filter(c => c.d > 0.2 && c.d <= START_D);

  // Collisions
  if (active && invuln <= 0) {
    for (const c of cars) {
      const lo = Math.min(c.od, c.d), hi = Math.max(c.od, c.d);
      if (hi >= 0.30 && lo <= 0.46 && Math.abs((c.lane - 1) * 0.667 - px) < CAR_W) { crashT = 1.5; speed = 0; break; }
    }
  }
  if (invuln > 0) invuln -= dt;
  if (crashT > 0) {
    crashT -= dt;
    if (crashT <= 0 && state === 'play') { px = 0; invuln = 2; cars = cars.filter(c => c.d > 12); }
  }
}

function drawCar(c) {
  const r = 40 / c.d;
  if (r > ROWS + 40) return;
  const s = r / 120, hw = ROAD_HW * s;
  const x = 160 + curve * 90 * (1 - s) * (1 - s) + ((c.lane - 1) * 0.667 - px) * hw;
  sprite(c.truck ? TRUCK : CAR, x, HZ + r, CAR_W * hw, c.truck ? 2.3 : 1, { C: c.col, M: c.col });
}

function drawPlayer() {
  if (crashT > 0) {
    if (crashT > 1.1) sprite(CAR, 160, 190, PLAYER_W, 1, {});
    const fx = 'YORWr';
    for (let i = 0; i < 24; i++) {
      ctx.fillStyle = COL[fx[Math.floor(Math.random() * fx.length)]];
      const k = 2 + Math.floor(Math.random() * 5);
      ctx.fillRect(Math.round(160 + (Math.random() - 0.5) * 50), Math.round(190 - Math.random() * 30), k, k);
    }
  } else if (invuln <= 0 || (Math.floor(invuln * 10) & 1)) sprite(CAR, 160, 190, PLAYER_W, 1, {});
}

function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const o = Math.round(skyOff);
  ctx.drawImage(sk, o, HZ + START_ROW - SKH); ctx.drawImage(sk, o - W, HZ + START_ROW - SKH);

  for (let r = START_ROW; r <= ROWS; r++) {
    const y = HZ + r, s = r / 120, hw = ROAD_HW * s, d = 40 / r;
    const cx = 160 + curve * 90 * (1 - s) * (1 - s) - px * hw;
    const mw = Math.max(1, Math.round(hw * 0.03));
    ctx.fillStyle = COL.L;
    ctx.fillRect(Math.round(cx - hw - mw / 2), y, mw, 1);
    ctx.fillRect(Math.round(cx + hw - mw / 2), y, mw, 1);
    if (r > 18 && (Math.floor((d + pos) / 0.28) & 1) === 0) {
      const lw = Math.max(1, Math.round(hw * 0.02));
      ctx.fillRect(Math.round(cx - hw / 3 - lw / 2), y, lw, 1);
      ctx.fillRect(Math.round(cx + hw / 3 - lw / 2), y, lw, 1);
    }
    if (r > 10 && (((d + pos) / 0.5) % 1) < 0.12) {
      ctx.fillStyle = COL.G;
      const pw = Math.max(1, Math.round(hw * 0.05));
      ctx.fillRect(Math.round(cx - hw * 1.12), y, pw, 1);
      ctx.fillRect(Math.round(cx + hw * 1.12), y, pw, 1);
    }
  }

  const sorted = cars.slice().sort((a, b) => b.d - a.d);
  let playerDrawn = false;
  for (const c of sorted) {
    if (!playerDrawn && c.d <= PD) { drawPlayer(); playerDrawn = true; }
    drawCar(c);
  }
  if (!playerDrawn) drawPlayer();

  if (state === 'title') {
    ctext('NEON RUN 2087', 8, 'L', 3);
    if (Math.floor(performance.now() / 500) & 1) ctext('PRESS ENTER', 110, 'Y', 2);
  } else {
    text('TIME ' + Math.ceil(time), 6, 4, 'L', 2);
    const sp = 'SPEED ' + Math.round(speed);
    text(sp, W - 6 - tw(sp, 2), 4, 'L', 2);
    if (crashT > 0) ctext('CRASH', 20, 'Y', 2);
    if (state === 'over') {
      ctext('TIME UP', 14, 'Y', 4);
      if (SHOW_POS) ctext('DIST ' + Math.round(endPos), 92, 'Y', 2);
      if (Math.floor(performance.now() / 500) & 1) ctext('PRESS ENTER', 110, 'Y', 2);
    }
  }
}

addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow')) e.preventDefault();
  keys[e.key] = true;
  if (e.key === 'Enter' && (state === 'title' || state === 'over')) start();
});
addEventListener('keyup', e => { keys[e.key] = false; });

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
